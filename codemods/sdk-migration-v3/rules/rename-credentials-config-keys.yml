# Config-key renames (packages/sdk/src/config/types.ts):
#   sessionStorage -> permitStorage
#   sessionTTL     -> permitTTL
#   keypairTTL     -> transportKeyPairTTL
#
# Scoped to a DIRECT, top-level property of the createConfig()/createZamaConfig()
# argument object, not "anywhere inside the call": `sessionStorage` collides with
# the browser's `window.sessionStorage` global, and all three names are generic
# enough to appear on an unrelated nested options bag inside the same call (e.g.
# `createConfig({ chains, customRelayerOptions: { sessionStorage: someCache } })`
# must not touch the nested one). The `inside` chain is three explicit hops
# (pair -> object -> arguments -> call), each checking only its immediate parent
# -- a single `inside` with `stopBy: end` would walk every ancestor up to the
# file root and match the nested case too.
#
# Known limitation: a config assembled via a variable or spread and passed to
# createConfig(cfg) is not rewritten here -- the property isn't syntactically
# inside the call, and widening the scope to reach it would reopen the same
# collision risk this scoping exists to avoid. That case still relies on the
# typecheck (TS2353 on a direct literal only) or manual review.
id: rename-config-session-storage
language: tsx
rule:
  pattern:
    context: "{ sessionStorage: $V }"
    selector: pair
  inside:
    kind: object
    inside:
      kind: arguments
      inside:
        any:
          - pattern: createConfig($$$ARGS)
          - pattern: createZamaConfig($$$ARGS)
fix: "permitStorage: $V"
---
id: rename-config-session-storage-shorthand
language: tsx
rule:
  pattern:
    context: "const o = { sessionStorage }"
    selector: shorthand_property_identifier
  inside:
    kind: object
    inside:
      kind: arguments
      inside:
        any:
          - pattern: createConfig($$$ARGS)
          - pattern: createZamaConfig($$$ARGS)
fix: "permitStorage: sessionStorage"
