name: Codemod

on:
  pull_request:
    branches: [main, beta, alpha]
    paths:
      - "codemods/**"
      - ".github/workflows/codemod.yml"

concurrency:
  group: codemod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Safe-chain enforces its own minimum-package-age check independently of
  # pnpm-workspace.yaml — mirror both the age (72 h) and the exclusion here.
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@zama-fhe/relayer-sdk"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      # The codemod transforms are syntactic (ast-grep / JSSG on fixtures), so no
      # SDK build is needed — just the codemod + ast-grep binaries from devDependencies.
      - name: Test codemods (JSSG + ast-grep rules + end-to-end chain)
        run: pnpm --filter @zama-fhe/sdk-migration-v3 test
