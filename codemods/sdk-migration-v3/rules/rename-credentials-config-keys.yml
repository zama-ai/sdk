# Config-key renames from the credentials refactor (SDK-134, PR #303) and the
# keypair/glossary alignment (SDK-204, PR #413):
#   sessionStorage  -> permitStorage        (packages/sdk/src/config/types.ts)
#   sessionTTL      -> permitTTL
#   keypairTTL      -> transportKeyPairTTL
#
# Scoped to a DIRECT, top-level property of the object literal passed to
# createConfig()/createZamaConfig() — not just "anywhere inside the call". This is
# NOT optional here: `sessionStorage` collides with the browser's `window.sessionStorage`
# global, so an unscoped pattern would corrupt unrelated code (and `keypairTTL`/`sessionTTL`
# are generic enough to plausibly appear on unrelated objects too, including a nested
# options bag inside the very createConfig(...) call this rule targets — e.g.
# `createConfig({ chains, customRelayerOptions: { sessionStorage: someCache } })` must NOT
# rewrite the nested one). The `inside` chain is deliberately three explicit hops
# (pair -> object -> arguments -> call), each with the default `stopBy: neighbor`
# (immediate parent only) — a single `inside` with `stopBy: end` would walk every
# ancestor up to the file root and match a nested object too, which is exactly the
# bug this three-hop form exists to avoid.
#
# Coverage gap (by design, not an oversight): a config assembled via a variable or spread
# and passed to createConfig(cfg) is NOT rewritten here — the property isn't syntactically
# inside the call, so extending the `inside` scope to catch it would reopen the same
# collision risk this scoping is meant to prevent. That case is caught instead by the
# runtime unknown-key guard in packages/sdk/src/config/build.ts (buildZamaConfig), which
# has no such scoping constraint since it inspects the actually-resolved object.
id: rename-config-session-storage
language: tsx
rule:
  pattern:
    context: "{ sessionStorage: $V }"
    selector: pair
  inside:
    kind: object
    inside:
      kind: arguments
      inside:
        any:
          - pattern: createConfig($$$ARGS)
          - pattern: createZamaConfig($$$ARGS)
fix: "permitStorage: $V"
---
id: rename-config-session-storage-shorthand
language: tsx
rule:
  pattern:
    context: "const o = { sessionStorage }"
    selector: shorthand_property_identifier
  inside:
    kind: object
    inside:
      kind: arguments
      inside:
        any:
          - pattern: createConfig($$$ARGS)
          - pattern: createZamaConfig($$$ARGS)
fix: "permitStorage: sessionStorage"
