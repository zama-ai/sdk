name: Install dependencies
description: >-
  Set up pnpm, Node.js, and Aikido Safe Chain, then install dependencies.
  Assumes the repo is already checked out — local composite actions can only
  run after checkout, so the caller owns that step.

inputs:
  ignore-scripts:
    description: Pass --ignore-scripts to `pnpm ci` (skips contract postinstall).
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.22.1
        cache: pnpm

    - name: Install Aikido Safe Chain
      shell: bash
      env:
        # Pinned safe-chain release. The installer reads SAFE_CHAIN_VERSION to pick
        # the binary and carries the binary checksums for its own release, so the
        # two must move together. Bump both values after vetting a newer release:
        #   curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/<ver>/install-safe-chain.sh | sha256sum
        SAFE_CHAIN_VERSION: "1.5.27"
        SAFE_CHAIN_INSTALLER_SHA256: "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8"
      run: |
        # Download the pinned installer, verify it against the hash committed here,
        # then run it — never pipe a remote script into a shell.
        installer="$RUNNER_TEMP/install-safe-chain.sh"
        curl -fsSL "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh" -o "$installer"
        echo "${SAFE_CHAIN_INSTALLER_SHA256}  ${installer}" | sha256sum -c -
        sh "$installer" --ci

    - name: Install dependencies
      shell: bash
      run: pnpm ci ${{ inputs.ignore-scripts == 'true' && '--ignore-scripts' || '' }}
