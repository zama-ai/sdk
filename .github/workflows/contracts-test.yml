name: Contracts Test

on:
  pull_request:
    branches: [main, beta, alpha]
    paths:
      - "contracts/src/**"
      - "contracts/test/**"
      - "contracts/foundry.toml"
      - "contracts/soldeer.lock"
      - "contracts/lib/forge-fhevm/src/**"
      - "contracts/lib/forge-fhevm/foundry.toml"
      - "contracts/lib/forge-fhevm/soldeer.lock"
      - ".github/workflows/contracts-test.yml"
  workflow_call:
    secrets:
      FHEVM_APP_CLIENT_ID:
        required: true
      FHEVM_APP_PRIVATE_KEY:
        required: true

concurrency:
  group: contracts-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts-test:
    # Fork PRs get no secrets, so the GitHub App token can't be minted there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build contracts
        uses: ./.github/actions/build-contracts
        with:
          fhevm-app-client-id: ${{ secrets.FHEVM_APP_CLIENT_ID }}
          fhevm-app-private-key: ${{ secrets.FHEVM_APP_PRIVATE_KEY }}

      - name: Run contract tests
        run: cd contracts && forge test -vvv
