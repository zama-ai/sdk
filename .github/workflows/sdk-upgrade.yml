name: SDK Upgrade

on:
  pull_request:
    branches: [main, prerelease]
    paths:
      - "scripts/sdk-upgrade/**"
      - "vitest.sdk-upgrade.config.ts"
      - "migrations/**"
      - ".github/workflows/sdk-upgrade.yml"
  workflow_call:

concurrency:
  group: sdk-upgrade-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Aikido Safe Chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        run: pnpm ci --ignore-scripts

      # Pure-node tests for the deterministic CLI core — no package build needed.
      - run: pnpm sdk-upgrade:test
