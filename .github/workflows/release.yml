name: Release

on:
  push:
    branches: [main, beta, alpha]
  workflow_dispatch:
    inputs:
      publish-tag:
        description: "Publish from existing git tag (e.g. v1.0.0). Skips semantic-release."
        required: false
        type: string
      npm-tag:
        description: "npm dist-tag override (auto-detected from version if left empty)"
        required: false
        type: string
      dry-run:
        description: "Dry run (log what would be published without actually publishing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Safe-chain enforces its own minimum-package-age check independently of
  # pnpm-workspace.yaml — mirror both the age (72 h) and the exclusion here.
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@fhevm/sdk,@zama-fhe/sdk,@zama-fhe/react-sdk"
  # Pinned safe-chain release used by the verified installer below; bump as newer versions are vetted.
  SAFE_CHAIN_VERSION: "1.5.15"

jobs:
  # ── Publish from tag (manual recovery) ──────────────────────────────
  publish-from-tag:
    if: inputs.publish-tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.publish-tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Ensure npm >=11
        run: |
          npm_v="$(npm --version)"
          if [[ "${npm_v%%.*}" -lt 11 ]]; then
            echo "Bundled npm ${npm_v} is too old; installing npm 11"
            pnpm add -g npm@^11
            echo "$(pnpm bin -g)" >> "$GITHUB_PATH"
            export PATH="$(pnpm bin -g):$PATH"
          fi
          echo "npm $(npm --version)"
          [[ "$(npm --version | cut -d. -f1)" -ge 11 ]]

      - name: Install Aikido Safe Chain
        run: |
          # Resolve the installer asset URL + its GitHub-published SHA-256, download it,
          # verify the hash, then execute — no piping a remote script into a shell.
          SAFECHAIN_URL="https://api.github.com/repos/AikidoSec/safe-chain/releases/tags/${SAFE_CHAIN_VERSION}"
          SC_INSTALL_URL=$(curl -fsSL "$SAFECHAIN_URL" | jq -r '.assets[] | select(.name=="install-safe-chain.sh") | .browser_download_url')
          SC_INSTALL_HASH=$(curl -fsSL "$SAFECHAIN_URL" | jq -r '.assets[] | select(.name=="install-safe-chain.sh") | .digest[7:]')
          curl -fsSL "$SC_INSTALL_URL" -o install-safe-chain.sh
          [ "$(sha256sum install-safe-chain.sh | awk '{print $1}')" = "$SC_INSTALL_HASH" ] \
            && echo "=> SHA256 install script matched" \
            || { echo "=> SHA256 mismatch — aborting"; rm -f install-safe-chain.sh; exit 1; }
          bash ./install-safe-chain.sh --ci

      - name: Install dependencies
        run: pnpm ci --ignore-scripts

      - name: Build packages
        run: pnpm build

      - name: Resolve version and npm tag
        id: npm-tag
        env:
          INPUT_TAG: ${{ inputs.publish-tag }}
          INPUT_NPM_TAG: ${{ inputs.npm-tag }}
        run: |
          version=$(node -p "require('./packages/sdk/package.json').version")
          expected="${INPUT_TAG#v}"  # strip leading v
          if [[ "$version" != "$expected" ]]; then
            echo "::error::package.json version (${version}) does not match git tag (${INPUT_TAG}). Aborting."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [[ -n "${INPUT_NPM_TAG}" ]]; then
            echo "tag=${INPUT_NPM_TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "$version" == *-* ]]; then
            npm_tag="${version#*-}"   # e.g. "alpha.10" from "1.0.0-alpha.10"
            npm_tag="${npm_tag%%.*}"   # e.g. "alpha"
            echo "tag=${npm_tag}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: true
          VERSION: ${{ steps.npm-tag.outputs.version }}
          NPM_TAG: ${{ steps.npm-tag.outputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          echo "Publishing v${VERSION} with tag '${NPM_TAG}'"

          flags=(--access public --tag "${NPM_TAG}")
          if [[ "${DRY_RUN}" == "true" ]]; then
            flags+=(--dry-run)
            echo "::notice::DRY RUN — packages will not actually be published"
          fi

          cd packages/sdk
          npm publish "${flags[@]}"
          cd ../react-sdk
          npm publish "${flags[@]}"

      - name: Summary
        if: success()
        env:
          VERSION: ${{ steps.npm-tag.outputs.version }}
          NPM_TAG: ${{ steps.npm-tag.outputs.tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "### Dry run complete" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published to npm" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Version | Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|---------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`@zama-fhe/sdk\` | \`${VERSION}\` | \`${NPM_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`@zama-fhe/react-sdk\` | \`${VERSION}\` | \`${NPM_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ── Normal release flow ─────────────────────────────────────────────
  validate-branch:
    if: github.event_name == 'workflow_dispatch' && inputs.publish-tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate target branch
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" && "${GITHUB_REF_NAME}" != "beta" && "${GITHUB_REF_NAME}" != "alpha" ]]; then
            echo "::error::Releases are only allowed from main, beta, or alpha (got: ${GITHUB_REF_NAME})."
            exit 1
          fi

  # build + lint + typecheck + format + size + vitest + api-report, sharing one build
  ci:
    needs: [validate-branch]
    if: ${{ !cancelled() && !failure() && inputs.publish-tag == '' }}
    uses: ./.github/workflows/ci.yml

  playwright:
    needs: [validate-branch]
    if: ${{ !cancelled() && !failure() && inputs.publish-tag == '' }}
    uses: ./.github/workflows/playwright.yml

  docs:
    needs: [validate-branch]
    if: ${{ !cancelled() && !failure() && inputs.publish-tag == '' }}
    uses: ./.github/workflows/docs.yml

  release:
    needs: [ci, playwright, docs]
    if: ${{ !cancelled() && !failure() && inputs.publish-tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Ensure npm >=11
        run: |
          npm_v="$(npm --version)"
          if [[ "${npm_v%%.*}" -lt 11 ]]; then
            echo "Bundled npm ${npm_v} is too old; installing npm 11"
            pnpm add -g npm@^11
            echo "$(pnpm bin -g)" >> "$GITHUB_PATH"
            export PATH="$(pnpm bin -g):$PATH"
          fi
          echo "npm $(npm --version)"
          [[ "$(npm --version | cut -d. -f1)" -ge 11 ]]

      - name: Install Aikido Safe Chain
        run: |
          # Resolve the installer asset URL + its GitHub-published SHA-256, download it,
          # verify the hash, then execute — no piping a remote script into a shell.
          SAFECHAIN_URL="https://api.github.com/repos/AikidoSec/safe-chain/releases/tags/${SAFE_CHAIN_VERSION}"
          SC_INSTALL_URL=$(curl -fsSL "$SAFECHAIN_URL" | jq -r '.assets[] | select(.name=="install-safe-chain.sh") | .browser_download_url')
          SC_INSTALL_HASH=$(curl -fsSL "$SAFECHAIN_URL" | jq -r '.assets[] | select(.name=="install-safe-chain.sh") | .digest[7:]')
          curl -fsSL "$SC_INSTALL_URL" -o install-safe-chain.sh
          [ "$(sha256sum install-safe-chain.sh | awk '{print $1}')" = "$SC_INSTALL_HASH" ] \
            && echo "=> SHA256 install script matched" \
            || { echo "=> SHA256 mismatch — aborting"; rm -f install-safe-chain.sh; exit 1; }
          bash ./install-safe-chain.sh --ci

      - name: Install dependencies
        run: pnpm ci --ignore-scripts

      - name: Build packages
        run: pnpm build

      - name: Semantic release
        id: release
        run: |
          set +e
          pnpm release:ci 2>&1 | tee /tmp/release-output.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          if grep -q "Published release" /tmp/release-output.txt; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$exit_code"
        env:
          GITHUB_TOKEN: ${{ secrets.SDK_RELEASER_TOKEN }}

      - name: Publish to npm
        if: steps.release.outputs.released == 'true'
        run: |
          version=$(node -p "require('./packages/sdk/package.json').version")
          if [[ "$version" == *-* ]]; then
            npm_tag="${version#*-}"   # e.g. "alpha.10" from "1.0.0-alpha.10"
            npm_tag="${npm_tag%%.*}"   # e.g. "alpha"
          else
            npm_tag="latest"
          fi
          echo "Publishing v${version} with tag '${npm_tag}'"
          cd packages/sdk
          npm publish --access public --tag "${npm_tag}"
          cd ../react-sdk
          npm publish --access public --tag "${npm_tag}"
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Verify release was published
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! grep -q "Published release" /tmp/release-output.txt; then
            echo "::error::semantic-release completed but no release was published."
            echo "Common causes: no releasable commits, branch not configured, or authentication issue."
            exit 1
          fi
