name: Integration

# Integration suite (`pnpm test:integration`). Separate from Vitest because it
# hits live infrastructure — notably the hosted mainnet relayer for the
# relayer-auth negative checks — so it has a different reliability profile.
# Keep this check NON-REQUIRED in branch protection: a transient mainnet/network
# blip should never block an unrelated merge.
on:
  pull_request:
    branches: [main, prerelease]
    paths:
      - "packages/sdk/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/integration.yml"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Safe-chain enforces its own minimum-package-age check independently of
  # pnpm-workspace.yaml — mirror both the age (72 h) and the exclusion here.
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@fhevm/sdk,@zama-fhe/sdk,@zama-fhe/react-sdk"

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Authenticates the hosted-mainnet relayer integration test. When unset,
      # that test is skipped (gated on the key's presence), so forks and
      # secret-less runs stay green.
      ZAMA_RELAYER_API_KEY: ${{ secrets.ZAMA_RELAYER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Build packages
        run: pnpm build

      - name: Run integration tests
        run: pnpm test:integration
