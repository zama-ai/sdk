id: rename-config-session-storage
valid:
  # window.sessionStorage (browser Web Storage API) must NOT be touched.
  - "sessionStorage.setItem('foo', 'bar');"
  - "const x = sessionStorage.getItem('foo');"
  # sessionStorage as a property key OUTSIDE createConfig/createZamaConfig must NOT be touched.
  - "const cache = { sessionStorage: myLegacyCache };"
  - "trackEvent({ sessionStorage: true });"
  # sessionStorage nested inside an options bag INSIDE createConfig must NOT be
  # touched either -- only a direct, top-level property of the call's argument
  # object is in scope (regression: a plain `stopBy: end` inside guard used to
  # match this too, since it walks every ancestor up to the file root).
  - "createConfig({ chains, customRelayerOptions: { sessionStorage: someCache } });"
invalid:
  - "createConfig({ storage, sessionStorage: sessionDBStorage });"
  - "createZamaConfig({ sessionStorage: sessionDBStorage, storage });"
---
id: rename-config-session-storage-shorthand
valid:
  - "const cache = { sessionStorage };"
invalid:
  - "createConfig({ storage, sessionStorage });"
---
id: rename-config-session-ttl
valid:
  - "const cache = { sessionTTL: 86400 };"
invalid:
  - "createConfig({ storage, sessionTTL: 86400 });"
  - "createZamaConfig({ sessionTTL: 86400, storage });"
---
id: rename-config-session-ttl-shorthand
valid:
  - "const cache = { sessionTTL };"
invalid:
  - "createConfig({ storage, sessionTTL });"
---
id: rename-config-keypair-ttl
valid:
  - "const cache = { keypairTTL: 2592000 };"
invalid:
  - "createConfig({ storage, keypairTTL: 2592000 });"
  - "createZamaConfig({ keypairTTL: 2592000, storage });"
---
id: rename-config-keypair-ttl-shorthand
valid:
  - "const cache = { keypairTTL };"
invalid:
  - "createConfig({ storage, keypairTTL });"
