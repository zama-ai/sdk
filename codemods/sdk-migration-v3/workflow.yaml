# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"

nodes:
  - id: upgrade
    name: "Upgrade @zama-fhe/sdk to 3.1.0 (mechanical subset)"
    type: automatic
    steps:
      # --- renames + config-key changes: native ast-grep ---
      - name: "useReadonlyToken -> useWrappedToken"
        ast-grep:
          config_file: "rules/rename-use-readonly-token.yml"
          include: ["**/*.{ts,tsx}"]
      - name: "useDelegatedUserDecrypt -> useDelegatedDecrypt"
        ast-grep:
          config_file: "rules/rename-use-delegated-user-decrypt.yml"
          include: ["**/*.{ts,tsx}"]
      - name: "useAllow/useIsAllowed -> useGrantPermit/useHasPermit"
        ast-grep:
          config_file: "rules/rename-permit-hooks.yml"
          include: ["**/*.{ts,tsx}"]
      - name: "createZamaConfig -> createConfig"
        js-ast-grep:
          js_file: "scripts/core-rename-createzamaconfig-to-createconfig.ts"
          language: "tsx"
          include: ["**/*.{ts,tsx}"]
      - name: "credentials config keys: sessionStorage/keypairTTL/sessionTTL -> permitStorage/transportKeyPairTTL/permitTTL"
        ast-grep:
          config_file: "rules/rename-credentials-config-keys.yml"
          include: ["**/*.{ts,tsx}"]
      - name: "Handle type -> EncryptedValue"
        ast-grep:
          config_file: "rules/core-handle-type-replaced-by-encrypted-value.yml"
          include: ["**/*.{ts,tsx}"]
      - name: "query-hook config field tokenAddress -> address"
        js-ast-grep:
          js_file: "scripts/react-config-token-field-renamed-to-address.ts"
          language: "tsx"
          include: ["**/*.{ts,tsx}"]
      - name: "useDelegationStatus tokenAddress -> contractAddress"
        ast-grep:
          config_file: "rules/use-delegation-status-config-contract-address.yml"
          include: ["**/*.{ts,tsx}"]
      # --- structural rewrites: JSSG ---
      - name: "mutation-hook config object -> positional address"
        js-ast-grep:
          js_file: "scripts/react-hooks-config-object-to-address-first.ts"
          language: "tsx"
          include: ["**/*.{ts,tsx}"]
      - name: "remove UseZamaConfig interface (inline + drop import)"
        js-ast-grep:
          js_file: "scripts/use-zama-config-interface-removed.ts"
          language: "tsx"
          include: ["**/*.{ts,tsx}"]
      - name: "ZamaSDK flat methods -> permits/delegations/decryption namespaces"
        js-ast-grep:
          js_file: "scripts/rename-sdk-namespace-methods.ts"
          language: "tsx"
          include: ["**/*.{ts,tsx}"]

  # --- optional AI assisted upgrade: the non-mechanical changes the codemods can't express ---
  # `type: manual` keeps this opt-in: `codemod workflow run` does NOT trigger it, so the
  # default upgrade (and the test suite) stays deterministic. Trigger it explicitly, with an
  # LLM configured via env, to draft the non-mechanical tail after the deterministic steps.
  - id: ai-upgrade
    name: "AI-assisted: apply the non-mechanical 3.1.0 changes"
    type: manual
    depends_on: [upgrade]
    steps:
      - name: "Apply the remaining (non-codemoddable) 3.1.0 breaking changes"
        ai:
          max_steps: 50
          prompt: |
            You are finishing an @zama-fhe/sdk + @zama-fhe/react-sdk upgrade to 3.1.0.
            The mechanical changes (renames, config-key changes, the UseZamaConfig
            removal, mutation-hook config->address, and ZamaSDK's flat methods moving
            under sdk.permits/sdk.delegations/sdk.decryption) were ALREADY applied by
            the preceding deterministic codemod steps — do NOT redo them. An SDK
            instance obtained other than through a local `new ZamaSDK(...)` (a factory,
            a hook, a re-exported singleton) may still have old-style flat calls left —
            fix those the same way, and if a call was `sdk.isDelegated(...)`, note that
            `isActive` also checks expiry (existence alone is no longer sufficient).

            Apply only the remaining breaking changes introduced in 3.1.0, editing the
            target files in place. Be conservative: minimal diffs, no unrelated
            refactors, never invent an API. Where a change has no drop-in replacement,
            leave a `// TODO(sdk-3.1.0): ...` comment describing what the caller must do
            instead, rather than guessing.

            Remaining 3.1.0 breaking changes:
            - useUserDecrypt(config) -> useUserDecrypt(encryptedInputs: EncryptedInput[]).
            - useEncrypt() now returns a contract-ready hex EncryptResult instead of
              { handles: Uint8Array[]; inputProof: Uint8Array }; update consumers that
              read .handles / .inputProof.
            - Removed with no drop-in (flag with a TODO; route to the high-level hooks):
              useCreateEIP712, useCreateDelegatedUserDecryptEIP712, useGenerateKeypair,
              usePublicKey, usePublicParams, useRequestZKProofVerification, useActivityFeed,
              and the RelayerWeb / RelayerNode classes.
            - Credentials types (SDK-134): `CredentialsManager`, `DelegatedCredentialsManager`,
              `CredentialsManagerConfig`, `DelegatedCredentialsManagerConfig` no longer exist —
              their config fields moved onto `ZamaConfigBase` directly (`permitStorage`,
              `transportKeyPairTTL`, `permitTTL`). `StoredCredentials` /
              `DelegatedStoredCredentials` don't have a 1:1 replacement type either — they
              split into `StoredTransportKeyPair` (keypair) + `Permission` (permit scope,
              includes `delegatorAddress`/`delegateAddress`), both exported from
              `@zama-fhe/sdk`. A caller typing against the old flat shape needs to restructure
              to the two separate types, not just rename the reference — flag with a TODO
              rather than guessing the split.
            - ZamaSDK: sdk.requireSigner(op) -> the sdk.signer property with a null guard;
              createReadonlyToken -> createToken / createWrappedToken.
            - Contract builders take hex (EncryptedValue / Hex) instead of Uint8Array for
              the encrypted amount and input proof.

            After editing, summarise what you changed and any TODOs you left.
