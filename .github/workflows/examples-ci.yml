name: Examples CI

# Typechecks (and builds, where applicable) every app under examples/ against
# the exact published SDK versions each example pins in its own package.json.
# examples/* are deliberately standalone npm projects (not pnpm workspace
# members) with committed lockfiles, so this installs each example exactly as
# an end user would and catches breakage in the example code itself — a bad
# import, a type error — against the SDK release it actually targets.
on:
  pull_request:
    branches: [main, prerelease]
    paths:
      - "examples/**"
      - ".github/workflows/examples-ci.yml"

concurrency:
  group: examples-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - example-bnb
          - example-hoodi
          - example-ingen
          - node-ethers
          - node-viem
          - react-ethers
          - react-turnkey-wallet
          - react-viem
          - react-wagmi
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/${{ matrix.example }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build --if-present
