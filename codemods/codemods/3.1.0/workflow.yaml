# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json
version: "1"
params:
  schema:
    ai:
      name: "AI tail"
      description: "Set to 'true' to run the optional AI step that applies the non-mechanical 3.1.0 changes. Needs an LLM configured via env (LLM_API_KEY / LLM_PROVIDER / LLM_MODEL). Off by default so the upgrade stays deterministic."
      type: string
      default: "false"
nodes:
  - id: upgrade
    name: "Upgrade @zama-fhe/sdk to 3.1.0 (mechanical subset)"
    type: automatic
    steps:
      # --- renames + config-key changes: native ast-grep ---
      - name: "useReadonlyToken -> useWrappedToken"
        ast-grep:
          config_file: "rules/rename-use-readonly-token.yml"
          include: ["**/*.{ts,tsx}"]
      - name: "useDelegatedUserDecrypt -> useDelegatedDecrypt"
        ast-grep:
          config_file: "rules/rename-use-delegated-user-decrypt.yml"
          include: ["**/*.{ts,tsx}"]
      - name: "useAllow/useIsAllowed -> useGrantPermit/useHasPermit"
        ast-grep:
          config_file: "rules/rename-permit-hooks.yml"
          include: ["**/*.{ts,tsx}"]
      - name: "createZamaConfig -> createConfig"
        ast-grep:
          config_file: "rules/core-rename-createzamaconfig-to-createconfig.yml"
          include: ["**/*.{ts,tsx}"]
      - name: "Handle type -> EncryptedValue"
        ast-grep:
          config_file: "rules/core-handle-type-replaced-by-encrypted-value.yml"
          include: ["**/*.{ts,tsx}"]
      - name: "query-hook config field tokenAddress -> address"
        ast-grep:
          config_file: "rules/react-config-token-field-renamed-to-address.yml"
          include: ["**/*.{ts,tsx}"]
      - name: "useDelegationStatus tokenAddress -> contractAddress"
        ast-grep:
          config_file: "rules/use-delegation-status-config-contract-address.yml"
          include: ["**/*.{ts,tsx}"]
      # --- structural rewrites: JSSG ---
      - name: "mutation-hook config object -> positional address"
        js-ast-grep:
          js_file: "scripts/react-hooks-config-object-to-address-first.ts"
          language: "tsx"
          include: ["**/*.{ts,tsx}"]
      - name: "remove UseZamaConfig interface (inline + drop import)"
        js-ast-grep:
          js_file: "scripts/use-zama-config-interface-removed.ts"
          language: "tsx"
          include: ["**/*.{ts,tsx}"]

  # --- optional AI tail: the non-mechanical changes the codemods can't express ---
  # Opt-in (`--param ai=true`) and runs only after the deterministic steps above,
  # so the default upgrade stays deterministic. Needs an LLM configured via env.
  - id: ai-tail
    name: "AI-assisted: apply the non-mechanical 3.1.0 changes"
    type: automatic
    depends_on: [upgrade]
    steps:
      - name: "Apply the remaining (non-codemoddable) 3.1.0 breaking changes"
        ai:
          max_steps: 50
          prompt: |
            You are finishing an @zama-fhe/sdk + @zama-fhe/react-sdk upgrade to 3.1.0.
            The mechanical changes (renames, config-key changes, the UseZamaConfig
            removal, mutation-hook config->address) were ALREADY applied by the
            preceding deterministic codemod steps — do NOT redo them.

            Apply only the remaining breaking changes introduced in 3.1.0, editing the
            target files in place. Be conservative: minimal diffs, no unrelated
            refactors, never invent an API. Where a change has no drop-in replacement,
            leave a `// TODO(sdk-3.1.0): ...` comment describing what the caller must do
            instead, rather than guessing.

            Remaining 3.1.0 breaking changes:
            - useUserDecrypt(config) -> useUserDecrypt(encryptedInputs: EncryptedInput[]).
            - useEncrypt() now returns a contract-ready hex EncryptResult instead of
              { handles: Uint8Array[]; inputProof: Uint8Array }; update consumers that
              read .handles / .inputProof.
            - Removed with no drop-in (flag with a TODO; route to the high-level hooks):
              useCreateEIP712, useCreateDelegatedUserDecryptEIP712, useGenerateKeypair,
              usePublicKey, usePublicParams, useRequestZKProofVerification, useActivityFeed,
              and the CredentialsManager / RelayerWeb / RelayerNode classes.
            - ZamaSDK: sdk.requireSigner(op) -> the sdk.signer property with a null guard;
              the flat methods (allow / isAllowed / userDecrypt / delegateDecryption / ...)
              move under sdk.decryption / sdk.delegations / sdk.permits; createReadonlyToken
              -> createToken / createWrappedToken.
            - Contract builders take hex (EncryptedValue / Hex) instead of Uint8Array for
              the encrypted amount and input proof.

            After editing, summarise what you changed and any TODOs you left.
