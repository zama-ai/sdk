name: Daemon CI

on:
  pull_request:
    paths:
      - "clients/**"
      - "proto/**"
      - "scripts/daemon/**"
      - "packages/sdk/**"
      - "packages/sdk-daemon/**"
      - "buf*.yaml"
      - "vitest.config.ts"
      - "vitest.shared.mts"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig*.json"
      - "api-extractor*.json"
      - "tools/**"
      - ".github/actions/install-deps/**"
      - ".github/workflows/daemon.yml"
  workflow_dispatch:

concurrency:
  group: daemon-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@fhevm/sdk,@zama-fhe/sdk,@zama-fhe/react-sdk"

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: |
            clients/go/go.sum
            clients/go/examples/balance/go.sum
      - name: Test library
        working-directory: clients/go
        run: |
          go test -race ./...
          go vet ./...
      - name: Test example and regenerate contract bindings
        working-directory: clients/go/examples/balance
        run: |
          go test -race ./...
          go vet ./...
          go generate ./contracts
      - name: Check Go formatting and generated bindings
        run: |
          test -z "$(gofmt -l clients/go)"
          git diff --exit-code -- clients/go

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install repository toolchain
        run: rustup show
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clients/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('clients/rust/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Check formatting
        run: cargo fmt --manifest-path clients/rust/Cargo.toml --check
      - name: Test default features
        run: cargo test --manifest-path clients/rust/Cargo.toml --locked
      - name: Test signer integration and example
        run: cargo test --manifest-path clients/rust/Cargo.toml --all-features --all-targets --locked
      - name: Lint
        run: cargo clippy --manifest-path clients/rust/Cargo.toml --all-features --all-targets --locked -- -D warnings
      - name: Validate crate for publication
        run: cargo publish --dry-run --locked --all-features -p zama-sdk --manifest-path clients/rust/Cargo.toml
      - name: Regenerate protobuf bindings
        run: |
          cargo run --manifest-path clients/rust/Cargo.toml -p zama-sdk-codegen --locked
          git diff --exit-code -- clients/rust

  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/install-deps
      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Check protobuf compatibility
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec node scripts/daemon/check-proto-compatibility.mjs "$BASE_SHA"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: clients/go/go.sum
      - name: Install repository toolchain
        run: rustup show
      - name: Regenerate TypeScript and Go protobuf bindings
        run: |
          pnpm exec buf format --diff --exit-code
          pnpm daemon:generate
          sh clients/go/generate.sh
          git diff --exit-code -- packages/sdk-daemon/src/generated clients/go/internal/gen
      - name: Build SDK and daemon
        run: pnpm daemon:build
      - name: Verify built package exports
        run: node --test packages/sdk-daemon/test/package-exports.test.mjs
      - name: Prepare native test drivers
        run: |
          cargo test --manifest-path clients/rust/Cargo.toml --test external_storage_restart --locked --no-run
          cargo test --manifest-path clients/rust/Cargo.toml --test encryption --all-features --locked --no-run
          cd clients/go
          go test -run '^$' ./...
      - name: Verify SDK equivalence and native credential recovery
        env:
          ZAMA_SDK_DAEMON_NATIVE_TESTS: "1"
        run: pnpm daemon:test

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/sdk-daemon/Dockerfile
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
