name: Integration

# Integration suite (`pnpm test:integration`). Separate from Vitest because it
# hits live infrastructure — notably the hosted mainnet relayer for the
# relayer-auth negative checks — so it has a different reliability profile.
# Keep this check NON-REQUIRED in branch protection: a transient mainnet/network
# blip should never block an unrelated merge.
on:
  pull_request:
    branches: [main, prerelease]
    paths:
      - "packages/sdk/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/integration.yml"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Safe-chain enforces its own minimum-package-age check independently of
  # pnpm-workspace.yaml#minimumReleaseAgeExclude — mirror the exemption here.
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@zama-fhe/relayer-sdk"

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      # Enables the live relayer-auth negative checks (cookie / bearer / no-auth
      # / bogus-key are rejected by the hosted relayer). No API key needed; set
      # here so the run command stays clean.
      ENABLE_RELAYER_AUTH_TESTS: "true"
    steps:
      # TODO: remove once GitHub runner images ship the CVE-2026-31431 kernel fix
      - name: Workaround CVE-2026-31431 (copy.fail)
        run: |
          echo "install algif_aead /bin/false" | sudo tee /etc/modprobe.d/disable-algif-aead.conf
          if lsmod | grep -q algif_aead; then
            sudo rmmod algif_aead || echo "WARNING: rmmod failed - module may be in use"
          elif modinfo algif_aead 2>/dev/null | grep -q builtin; then
            echo "WARNING: algif_aead built-in - modprobe.d blacklist has no effect"
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Aikido Safe Chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        run: pnpm ci

      - name: Build packages
        run: pnpm build

      - name: Run integration tests
        run: pnpm test:integration
