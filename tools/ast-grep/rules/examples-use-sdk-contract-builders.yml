  regex: ^function (name|symbol|decimals|totalSupply|balanceOf|allowance|approve|rate|underlying|wrap|unwrap|setOperator|isOperator|supportsInterface|transferAndCall|confidentialTransfer|confidentialBalanceOf)\(
