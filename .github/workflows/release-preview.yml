name: Release Preview

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: release-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  # Safe-chain enforces its own minimum-package-age check independently of
  # pnpm-workspace.yaml#minimumReleaseAgeExclude — mirror the exemption here.
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@zama-fhe/relayer-sdk"

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      # TODO: remove once GitHub runner images ship the CVE-2026-31431 kernel fix
      - name: Workaround CVE-2026-31431 (copy.fail)
        run: |
          echo "install algif_aead /bin/false" | sudo tee /etc/modprobe.d/disable-algif-aead.conf
          if lsmod | grep -q algif_aead; then
            sudo rmmod algif_aead || echo "WARNING: rmmod failed - module may be in use"
          elif modinfo algif_aead 2>/dev/null | grep -q builtin; then
            echo "WARNING: algif_aead built-in - modprobe.d blacklist has no effect"
          fi

      - name: Validate target branch
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" && "${GITHUB_REF_NAME}" != "prerelease" ]]; then
            echo "Release preview is only allowed from main or prerelease (got: ${GITHUB_REF_NAME})."
            exit 1
          fi

  preview:
    needs: [validate-branch]
    runs-on: ubuntu-latest
    steps:
      # TODO: remove once GitHub runner images ship the CVE-2026-31431 kernel fix
      - name: Workaround CVE-2026-31431 (copy.fail)
        run: |
          echo "install algif_aead /bin/false" | sudo tee /etc/modprobe.d/disable-algif-aead.conf
          if lsmod | grep -q algif_aead; then
            sudo rmmod algif_aead || echo "WARNING: rmmod failed - module may be in use"
          elif modinfo algif_aead 2>/dev/null | grep -q builtin; then
            echo "WARNING: algif_aead built-in - modprobe.d blacklist has no effect"
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Ensure npm >=11
        run: |
          npm_v="$(npm --version)"
          if [[ "${npm_v%%.*}" -lt 11 ]]; then
            echo "Bundled npm ${npm_v} is too old; installing npm 11"
            pnpm add -g npm@^11
            echo "$(pnpm bin -g)" >> "$GITHUB_PATH"
            export PATH="$(pnpm bin -g):$PATH"
          fi
          echo "npm $(npm --version)"
          [[ "$(npm --version | cut -d. -f1)" -ge 11 ]]

      - name: Install Aikido Safe Chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        run: pnpm ci --ignore-scripts

      - name: Build packages
        run: pnpm build

      - name: Semantic release (dry-run)
        run: pnpm release:dry-run 2>&1 | tee /tmp/dry-run-output.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write preview summary
        if: always()
        run: |
          echo "## Release Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if grep -q "next release version" /tmp/dry-run-output.txt; then
            echo "A release **would** be published:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            grep "next release version" /tmp/dry-run-output.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release would be published from this branch." >> "$GITHUB_STEP_SUMMARY"
          fi
