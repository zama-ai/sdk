version: 2
updates:
  # SDK core packages and workspace tooling
  - package-ecosystem: npm
    target-branch: beta
    directories:
      - /
      - /packages/sdk
      - /packages/react-sdk
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      exclude:
        - "@zama-fhe/relayer-sdk"
    groups:
      sdk:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch

  # Test apps
  - package-ecosystem: npm
    target-branch: beta
    directories:
      - /test/test-nextjs
      - /test/test-vite
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      exclude:
        - "@zama-fhe/sdk"
        - "@zama-fhe/react-sdk"
        - "@zama-fhe/test-components"
    groups:
      test-apps:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch

  # Example apps
  - package-ecosystem: npm
    target-branch: beta
    directories:
      - /examples/example-bnb
      - /examples/example-hoodi
      - /examples/example-ingen
      - /examples/node-ethers
      - /examples/node-viem
      - /examples/react-ethers
      - /examples/react-turnkey-wallet
      - /examples/react-viem
      - /examples/react-wagmi
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      exclude:
        - "@zama-fhe/sdk"
        - "@zama-fhe/react-sdk"
    groups:
      example-apps:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch

  - package-ecosystem: github-actions
    target-branch: beta
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
