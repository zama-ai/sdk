x-build-args: &build-args
  RUNTIME_UID: ${ZAMA_SDK_DAEMON_UID:-1000}
  RUNTIME_GID: ${ZAMA_SDK_DAEMON_GID:-1000}

services:
  daemon:
    image: zama-sdk-daemon:dev
    build:
      context: ../..
      dockerfile: packages/sdk-daemon/Dockerfile
      args: *build-args
    environment:
      ZAMA_SDK_DAEMON_SOCKET_PATH: /run/zama/sdk.sock
    volumes:
      - socket:/run/zama
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 150s
  go:
    profiles: [examples]
    build:
      context: ../..
      dockerfile: clients/go/Dockerfile
      args: *build-args
    volumes:
      - socket:/run/zama:ro
      - ../../.env.daemon.local:/config/.env.daemon.local:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  rust:
    profiles: [examples]
    build:
      context: ../..
      dockerfile: clients/rust/Dockerfile
      args: *build-args
    environment:
      ZAMA_SDK_DAEMON_SOCKET_PATH: /run/zama/sdk.sock
    volumes:
      - socket:/run/zama:ro
      - ../../.env.daemon.local:/config/.env.daemon.local:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  socket:
