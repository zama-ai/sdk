name: Docs

on:
  pull_request:
    branches: [main, prerelease]
    paths: &doc-paths
      - "docs/**"
      - "examples/**/README.md"
      - "examples/**/WALKTHROUGH.md"
      - "README.md"
      - "packages/*/README.md"
      - "packages/*/etc/**"
      - "scripts/llm/**"
      - "scripts/docs/**"
      - "llms.txt"
      - "llms-full.txt"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  # semantic-release forces branch-to-branch merges (prerelease→main) with the
  # docs:retarget fix committed directly on top, so doc changes routinely reach
  # main/prerelease via direct push, never a PR. Run the checks there too.
  push:
    branches: [main, prerelease]
    paths: *doc-paths
  workflow_call:

# Namespaced by workflow so the standalone Docs run (push/PR) and the docs job
# reused by release.yml don't share a group on the same ref and cancel each other.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Safe-chain enforces its own minimum-package-age check independently of
  # pnpm-workspace.yaml — mirror both the age (72 h) and the exclusion here.
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@zama-fhe/relayer-sdk,@zama-fhe/sdk,@zama-fhe/react-sdk"

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Aikido Safe Chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        run: pnpm ci

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Check internal doc links
        run: pnpm exec turbo run docs:check-links

      - name: Verify LLM corpus artifacts are up to date
        run: pnpm exec turbo run llm:check

      # Doc URLs are branch-specific (raw.githubusercontent .../main|prerelease, and
      # docs.zama.org .../stable|alpha). `github.base_ref` is the branch this PR lands
      # on — reliable here even though the PR is checked out detached. If the committed
      # URLs target the wrong branch (e.g. a promotion that forgot `pnpm docs:retarget`),
      # this fails. `ref_name` covers the direct-push and workflow_call (release) paths.
      - name: Verify doc URLs target the right branch
        run: pnpm docs:check-target "${{ github.base_ref || github.ref_name }}"

  # External link liveness for the published docs + READMEs. Internal links and
  # anchors are checked above by `pnpm docs:check-links`; this job covers `https://`
  # targets. Runs for PRs and direct pushes to main/prerelease, but NOT when this
  # workflow is reused by release.yml: there `github.workflow` is the caller's name
  # ("Release"), so external flakiness still can't block a release. If it flakes on
  # PRs, move to a scheduled (cron) workflow.
  link-check:
    if: github.workflow == 'Docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Check external links (lychee)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          # Accept 403/429 so bot-hostile hosts (Discord, Etherscan) don't flake the gate.
          # Placeholder URLs in code samples are listed in .lycheeignore.
          args: --no-progress --max-retries 3 --accept 200..=299,403,429 --cache "docs/**/*.md" "README.md" "packages/*/README.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
