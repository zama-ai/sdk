version: 2
# Dependabot cannot use OIDC: a read-only Docker Hub organization access token, stored as Dependabot secrets
# (not Actions secrets).
registries:
  dhi:
    type: docker-registry
    url: https://dhi.io
    username: ${{ secrets.DOCKERHUB_USER }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}

updates:
  # SDK core, workspace tooling, and test apps -- one pnpm workspace, "/" must stay in scope for the shared lockfile.
  - package-ecosystem: npm
    target-branch: beta
    directories:
      - /
      - /packages/sdk
      - /packages/react-sdk
      - /packages/sdk-daemon
      - /test/test-nextjs
      - /test/test-vite
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      exclude:
        - "@zama-fhe/sdk"
        - "@zama-fhe/react-sdk"
        - "@zama-fhe/test-components"
    groups:
      sdk:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
      # Protocol-version-tied; bumped via alpha, not routine Dependabot.
      - dependency-name: "@fhevm/sdk"

  # Example apps
  - package-ecosystem: npm
    target-branch: beta
    directories:
      - /examples/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      exclude:
        - "@zama-fhe/sdk"
        - "@zama-fhe/react-sdk"
    groups:
      example-apps:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch

  # Daemon image bases, pinned by digest. Majors are ignored: the Node.js line follows the daemon's engines field.
  # The client example images are left out on purpose: their toolchains track go.mod and rust-toolchain.toml.
  - package-ecosystem: docker
    target-branch: beta
    directory: /packages/sdk-daemon
    registries:
      - dhi
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Go and Rust clients
  - package-ecosystem: gomod
    target-branch: beta
    directories:
      - /clients/go
      - /clients/go/examples/balance
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      go-client:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch

  - package-ecosystem: cargo
    target-branch: beta
    directory: /clients/rust
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      rust-client:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch

  - package-ecosystem: github-actions
    target-branch: beta
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
