name: Integration

# Integration suite (`pnpm test:integration`). Separate from Vitest because it
# hits live infrastructure — notably the hosted mainnet relayer for the
# relayer-auth negative checks — so it has a different reliability profile.
# Keep this check NON-REQUIRED in branch protection: a transient mainnet/network
# blip should never block an unrelated merge.
on:
  pull_request:
    branches: [main, prerelease]
    paths:
      - "packages/sdk/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/integration.yml"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Safe-chain enforces its own minimum-package-age check independently of
  # pnpm-workspace.yaml — mirror both the age (72 h) and the exclusion here.
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@zama-fhe/relayer-sdk,@zama-fhe/sdk,@zama-fhe/react-sdk"

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Enables the live relayer-auth negative checks (cookie / bearer / no-auth
      # / bogus-key are rejected by the hosted relayer). No API key needed.
      # Toggle without a commit via the repo variable (Settings → Variables) —
      # set it to "true" to run them; unset/anything-else skips them. Acts as a
      # kill switch if the hosted relayer's auth behavior changes and the canary
      # needs muting while it's reconciled.
      ENABLE_RELAYER_AUTH_TESTS: ${{ vars.ENABLE_RELAYER_AUTH_TESTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Build packages
        run: pnpm build

      - name: Run integration tests
        run: pnpm test:integration
