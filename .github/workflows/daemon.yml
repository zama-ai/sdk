name: Daemon CI

on:
  pull_request:
    paths:
      - "clients/**"
      - "proto/**"
      - "scripts/daemon/**"
      - "packages/sdk/**"
      - "packages/sdk-daemon/**"
      - "buf*.yaml"
      - "vitest.config.ts"
      - "vitest.shared.mts"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig*.json"
      - "api-extractor*.json"
      - "tools/**"
      - ".github/actions/install-deps/**"
      - ".github/workflows/daemon.yml"
  workflow_dispatch:
  workflow_call:

# Namespaced by workflow so a standalone run and a calling workflow on the same ref do not cancel each other.
concurrency:
  group: daemon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@fhevm/sdk,@zama-fhe/sdk,@zama-fhe/react-sdk"

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: |
            clients/go/go.sum
            clients/go/examples/balance/go.sum
      - name: Test library
        working-directory: clients/go
        run: |
          go test -race ./...
          go vet ./...
      - name: Test example and regenerate contract bindings
        working-directory: clients/go/examples/balance
        run: |
          go test -race ./...
          go vet ./...
          go generate ./contracts
      - name: Check Go formatting and generated bindings
        run: |
          test -z "$(gofmt -l clients/go)"
          git diff --exit-code -- clients/go

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install repository toolchain
        run: rustup show
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clients/rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('clients/rust/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Check formatting
        run: cargo fmt --manifest-path clients/rust/Cargo.toml --check
      - name: Test default features
        run: cargo test --manifest-path clients/rust/Cargo.toml --locked
      - name: Test signer integration and example
        run: cargo test --manifest-path clients/rust/Cargo.toml --all-features --all-targets --locked
      - name: Lint
        run: cargo clippy --manifest-path clients/rust/Cargo.toml --all-features --all-targets --locked -- -D warnings
      - name: Validate crate for publication
        run: cargo publish --dry-run --locked --all-features -p zama_sdk --manifest-path clients/rust/Cargo.toml
      - name: Regenerate protobuf bindings
        run: |
          cargo run --manifest-path clients/rust/Cargo.toml -p zama-sdk-codegen --locked
          git diff --exit-code -- clients/rust

  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/install-deps
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: clients/go/go.mod
          cache-dependency-path: clients/go/go.sum
      - name: Install repository toolchain
        run: rustup show
      - name: Regenerate TypeScript and Go protobuf bindings
        run: |
          pnpm exec buf format --diff --exit-code
          pnpm daemon:generate
          sh clients/go/generate.sh
          git diff --exit-code -- packages/sdk-daemon/src/generated clients/go/internal/gen
      - name: Build SDK and daemon
        run: pnpm daemon:build
      - name: Verify built package exports
        run: node --test packages/sdk-daemon/test/package-exports.test.mjs
      - name: Prepare native test drivers
        run: |
          cargo test --manifest-path clients/rust/Cargo.toml --test external_storage_restart --locked --no-run
          cargo test --manifest-path clients/rust/Cargo.toml --test encryption --all-features --locked --no-run
          cd clients/go
          go test -run '^$' ./...
      - name: Verify SDK equivalence and native credential recovery
        env:
          ZAMA_SDK_DAEMON_NATIVE_TESTS: "1"
        run: pnpm daemon:test

  dockerfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true

  image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/sdk-daemon/Dockerfile
          load: true
          tags: ghcr.io/zama-ai/sdk-daemon:ci
          # Scoped per architecture so the two builds don't overwrite each other's cache.
          cache-from: type=gha,scope=daemon-image-${{ matrix.arch }}
          cache-to: type=gha,scope=daemon-image-${{ matrix.arch }},mode=max
      # From zama-ai/ci-templates security/trivy.yml. Only fixable HIGH or CRITICAL findings fail: Debian
      # advisories without a fix yet can't be addressed in the image.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/zama-ai/sdk-daemon:ci
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Start the daemon with the deployment Compose file
        env:
          ZAMA_SDK_VERSION: ci
        run: |
          trap 'docker compose -f packages/sdk-daemon/deploy/compose.yaml down -v' EXIT
          docker compose -f packages/sdk-daemon/deploy/compose.yaml up -d --wait --wait-timeout 120
      - name: Start the daemon with the host Compose file
        working-directory: packages/sdk-daemon/deploy
        env:
          ZAMA_SDK_VERSION: ci
        run: |
          install -d -m 700 socket storage
          export ZAMA_SDK_DAEMON_UID="$(id -u)" ZAMA_SDK_DAEMON_GID="$(id -g)"
          trap 'docker compose -f compose.host.yaml down' EXIT
          docker compose -f compose.host.yaml up -d --wait --wait-timeout 120
          test -S socket/sdk.sock
