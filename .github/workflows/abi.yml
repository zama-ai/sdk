name: ABI Check

on:
  pull_request:
    branches: [main, beta, alpha]
    paths:
      - "contracts/src/**"
      - "contracts/foundry.toml"
      - "contracts/soldeer.lock"
      - "contracts/lib/forge-fhevm/src/**"
      - "contracts/lib/forge-fhevm/foundry.toml"
      - "contracts/lib/forge-fhevm/soldeer.lock"
      - "packages/sdk/src/abi/**"
      - "scripts/abi/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/abi.yml"
  workflow_call:
    secrets:
      FHEVM_APP_CLIENT_ID:
        required: true
      FHEVM_APP_PRIVATE_KEY:
        required: true

concurrency:
  group: abi-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  abi-check:
    # Fork PRs get no secrets, so the GitHub App token can't be minted there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Build contracts
        uses: ./.github/actions/build-contracts
        with:
          fhevm-app-client-id: ${{ secrets.FHEVM_APP_CLIENT_ID }}
          fhevm-app-private-key: ${{ secrets.FHEVM_APP_PRIVATE_KEY }}

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          ignore-scripts: "true"

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # turbo run abi:check chains //#contracts:build -> //#abi:build -> //#abi:check.
      # The forge build/cache above already materialises contracts/out + dependencies,
      # so contracts:build is a cheap no-op (forge is incremental) when turbo misses,
      # and the whole chain is skipped when abi inputs are unchanged (e.g. a dep bump
      # triggered this run via package.json but no .sol/abi source moved).
      - name: Verify SDK ABIs are up to date
        run: pnpm exec turbo run abi:check
