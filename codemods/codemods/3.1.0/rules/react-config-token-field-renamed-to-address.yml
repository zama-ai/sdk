# Scoped per-hook rewrites: ast-grep cannot easily express "any of these N hooks", so we
# duplicate the rule pair per hook name. This is the authoring-cost gotcha the spike was
# designed to surface — jscodeshift expresses the same thing once with a `Set` predicate.
#
# Two sub-edits per hook:
#   (a) tokenAddress, wrapperAddress: tokenAddress  ->  tokenAddress  (drop redundant wrapper)
#   (b) tokenAddress: $V                            ->  address: $V
#   (c) tokenAddresses: $V                          ->  addresses: $V

# --- useShield --------------------------------------------------------------
id: useShield-drop-wrapper
language: tsx
rule:
  pattern: "useShield({ tokenAddress, wrapperAddress: tokenAddress })"
fix: "useShield({ address: tokenAddress })"
---
id: useShield-rename-key
language: tsx
rule:
  pattern: "useShield({ tokenAddress: $V })"
fix: "useShield({ address: $V })"
---
# --- useConfidentialBalances (plural) ---------------------------------------
id: useConfidentialBalances-rename-key
language: tsx
rule:
  pattern: "useConfidentialBalances({ tokenAddresses: $V })"
fix: "useConfidentialBalances({ addresses: $V })"
---
