name: Release

on:
  push:
    branches: [main, beta, alpha]
  workflow_dispatch:
    inputs:
      publish-tag:
        description: "Publish from existing git tag (e.g. v1.0.0). Skips semantic-release."
        required: false
        type: string
      npm-tag:
        description: "npm dist-tag override (auto-detected from version if left empty)"
        required: false
        type: string
      publish:
        description: "With publish-tag: publish npm, the daemon image, the Rust crate, the Go module, or all"
        required: false
        type: choice
        options: [npm, image, rust, go, all]
        default: npm
      dry-run:
        description: "Dry run (log what would be published without actually publishing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Safe-chain enforces its own minimum-package-age check independently of
  # pnpm-workspace.yaml — mirror both the age (72 h) and the exclusion here.
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@fhevm/sdk,@zama-fhe/sdk,@zama-fhe/react-sdk"
  DAEMON_IMAGE: ghcr.io/zama-ai/sdk-daemon
  DAEMON_IMAGE_TITLE: Zama SDK daemon
  DAEMON_IMAGE_DESCRIPTION: Runs the Zama SDK for Go and Rust applications over a private Unix socket.
  DAEMON_IMAGE_LICENSES: BSD-3-Clause-Clear
  CRATE: zama_sdk

jobs:
  # ── Publish from tag (manual recovery) ──────────────────────────────
  # Outputs are set only once the tag is verified, so the npm and image recovery jobs never see an unverified commit.
  verify-tag:
    if: inputs.publish-tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Fully-qualified refs/tags/ — fails if it's a branch, no ambiguity
          # with a same-named branch. fetch-depth: 0 also fetches main/beta/
          # alpha as origin/* for the ancestor check below.
          ref: refs/tags/${{ inputs.publish-tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is reachable from a protected branch
        env:
          INPUT_TAG: ${{ inputs.publish-tag }}
        run: |
          protected_branches="main beta alpha"
          head_sha="$(git rev-parse HEAD)"

          # Reachable from a protected branch => it landed via a reviewed PR.
          # --is-ancestor exits 1 for "not an ancestor" but any other non-zero
          # code for a real git error (missing ref, bad fetch) — don't conflate
          # the two into the same "not reachable" message.
          for branch in ${protected_branches}; do
            git merge-base --is-ancestor HEAD "origin/${branch}" && rc=0 || rc=$?
            if [[ "${rc}" -eq 0 ]]; then
              echo "Verified: ${head_sha} (tag '${INPUT_TAG}') is reachable from '${branch}'."
              exit 0
            elif [[ "${rc}" -ne 1 ]]; then
              echo "::error::git merge-base failed unexpectedly (exit ${rc}) checking origin/${branch}."
              exit "${rc}"
            fi
          done

          echo "::error::Commit ${head_sha} (tag '${INPUT_TAG}') is not reachable from any of: ${protected_branches}. Refusing to publish from an unreviewed ref."
          exit 1

      - name: Resolve version and channel
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.publish-tag }}
        run: |
          version="$(jq -r .version packages/sdk/package.json)"
          if [[ "${version}" != "${INPUT_TAG#v}" ]]; then
            echo "::error::package.json version (${version}) does not match git tag (${INPUT_TAG}). Aborting."
            exit 1
          fi
          channel="latest"
          if [[ "${version}" == *-* ]]; then
            channel="${version#*-}"   # e.g. "alpha.10" from "1.0.0-alpha.10"
            channel="${channel%%.*}"  # e.g. "alpha"
          fi
          {
            echo "version=${version}"
            echo "channel=${channel}"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  publish-from-tag:
    needs: [verify-tag]
    if: inputs.publish == 'npm' || inputs.publish == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      # The verified commit, not the tag, which can still move.
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify-tag.outputs.revision }}
          persist-credentials: false

      # Local actions resolve against the checkout above, i.e. the old tag. Take install-deps
      # from the workflow's own commit so an old tag cannot bring back an unpinned installer.
      - name: Checkout workflow actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: .workflow
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Install dependencies
        uses: ./.workflow/.github/actions/install-deps
        with:
          ignore-scripts: "true"

      - name: Ensure npm >=11
        run: |
          npm_v="$(npm --version)"
          if [[ "${npm_v%%.*}" -lt 11 ]]; then
            echo "Bundled npm ${npm_v} is too old; installing npm 11"
            pnpm add -g npm@^11
            echo "$(pnpm bin -g)" >> "$GITHUB_PATH"
            export PATH="$(pnpm bin -g):$PATH"
          fi
          echo "npm $(npm --version)"
          [[ "$(npm --version | cut -d. -f1)" -ge 11 ]]

      - name: Build packages
        run: pnpm build

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: true
          VERSION: ${{ needs.verify-tag.outputs.version }}
          NPM_TAG: ${{ inputs.npm-tag || needs.verify-tag.outputs.channel }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          echo "Publishing v${VERSION} with tag '${NPM_TAG}'"

          flags=(--access public --tag "${NPM_TAG}")
          if [[ "${DRY_RUN}" == "true" ]]; then
            flags+=(--dry-run)
            echo "::notice::DRY RUN — packages will not actually be published"
          fi

          cd packages/sdk
          npm publish "${flags[@]}"
          cd ../react-sdk
          npm publish "${flags[@]}"

      - name: Summary
        if: success()
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
          NPM_TAG: ${{ inputs.npm-tag || needs.verify-tag.outputs.channel }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "### Dry run complete" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published to npm" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Version | Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|---------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`@zama-fhe/sdk\` | \`${VERSION}\` | \`${NPM_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`@zama-fhe/react-sdk\` | \`${VERSION}\` | \`${NPM_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ── Normal release flow ─────────────────────────────────────────────
  validate-branch:
    if: github.event_name == 'workflow_dispatch' && inputs.publish-tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate target branch
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" && "${GITHUB_REF_NAME}" != "beta" && "${GITHUB_REF_NAME}" != "alpha" ]]; then
            echo "::error::Releases are only allowed from main, beta, or alpha (got: ${GITHUB_REF_NAME})."
            exit 1
          fi

  # build + lint + typecheck + format + size + vitest + api-report, sharing one build
  ci:
    needs: [validate-branch]
    if: ${{ !cancelled() && !failure() && inputs.publish-tag == '' }}
    uses: ./.github/workflows/ci.yml

  playwright:
    needs: [validate-branch]
    if: ${{ !cancelled() && !failure() && inputs.publish-tag == '' }}
    uses: ./.github/workflows/playwright.yml
    secrets:
      FHEVM_APP_CLIENT_ID: ${{ secrets.FHEVM_APP_CLIENT_ID }}
      FHEVM_APP_PRIVATE_KEY: ${{ secrets.FHEVM_APP_PRIVATE_KEY }}

  docs:
    needs: [validate-branch]
    if: ${{ !cancelled() && !failure() && inputs.publish-tag == '' }}
    uses: ./.github/workflows/docs.yml

  daemon:
    needs: [validate-branch]
    if: ${{ !cancelled() && !failure() && inputs.publish-tag == '' }}
    uses: ./.github/workflows/daemon.yml
    # Only the called job, which declares the environment, can read this environment secret, but the caller must
    # still pass it by name: `secrets: inherit` does not carry it.
    secrets:
      DOCKERHUB_OIDC_CONNECTIONID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}

  release:
    needs: [ci, playwright, docs, daemon]
    if: ${{ !cancelled() && !failure() && inputs.publish-tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          ignore-scripts: "true"

      - name: Ensure npm >=11
        run: |
          npm_v="$(npm --version)"
          if [[ "${npm_v%%.*}" -lt 11 ]]; then
            echo "Bundled npm ${npm_v} is too old; installing npm 11"
            pnpm add -g npm@^11
            echo "$(pnpm bin -g)" >> "$GITHUB_PATH"
            export PATH="$(pnpm bin -g):$PATH"
          fi
          echo "npm $(npm --version)"
          [[ "$(npm --version | cut -d. -f1)" -ge 11 ]]

      - name: Build packages
        run: pnpm build

      # Outputs are written by the @semantic-release/exec commands in .releaserc.cjs.
      - name: Semantic release
        id: release
        run: pnpm release:ci
        env:
          GITHUB_TOKEN: ${{ secrets.SDK_RELEASER_TOKEN }}

      - name: Publish to npm
        if: steps.release.outputs.released == 'true'
        run: |
          echo "Publishing v${VERSION} with tag '${CHANNEL}'"
          cd packages/sdk
          npm publish --access public --tag "${CHANNEL}"
          cd ../react-sdk
          npm publish --access public --tag "${CHANNEL}"
        env:
          NPM_CONFIG_PROVENANCE: true
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}

      - name: Verify release was published
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASED: ${{ steps.release.outputs.released }}
        run: |
          if [[ "${RELEASED}" != "true" ]]; then
            echo "::error::semantic-release completed but no release was published."
            echo "Common causes: no releasable commits, branch not configured, or authentication issue."
            exit 1
          fi

  # Main only: prerelease pins would reach main through promotions and conflict on backmerges.
  # A chore title keeps the bump PR's merge from cutting another release.
  bump-examples:
    needs: [release]
    if: >-
      ${{ !cancelled() && github.ref_name == 'main'
      && needs.release.result == 'success' && needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      BASE: ${{ github.ref_name }}
      BRANCH: chore/examples-sdk-${{ needs.release.outputs.version }}
      TITLE: "chore(no-release): bump examples to SDK ${{ needs.release.outputs.version }}"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      # Puts safe-chain in front of the npm installs that rewrite the example lockfiles.
      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          ignore-scripts: "true"

      # Waits for the release on npm and pins it only if it is npm latest, so a re-run for an older release never downgrades.
      - name: Pin the examples
        id: bump
        run: node scripts/examples/bump-sdk.mjs "${VERSION}"

      # The releaser token, not GITHUB_TOKEN, so the PR triggers Examples CI.
      - name: Open the bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_RELEASER_TOKEN }}
        run: |
          if [[ "$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --state open --json number --jq length)" != "0" ]]; then
            echo "::notice::A bump PR for ${VERSION} is already open."
            exit 0
          fi
          git switch -c "${BRANCH}"
          git add examples
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "${TITLE}"
          # Overwrites a branch left by a closed bump PR for the same version.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          gh pr create --repo "${GITHUB_REPOSITORY}" --base "${BASE}" --head "${BRANCH}" --title "${TITLE}" \
            --body "Pins the example apps to \`@zama-fhe/sdk\` and \`@zama-fhe/react-sdk\` ${VERSION}."

  # Runs even if npm publish failed: the tag exists and a re-run of the release job cannot republish it.
  publish-image:
    needs: [release, verify-tag]
    if: >-
      ${{ !cancelled() && (needs.release.outputs.released == 'true'
      || (needs.verify-tag.result == 'success' && (inputs.publish == 'image' || inputs.publish == 'all') && !inputs.dry-run)) }}
    # From the release run, or from verify-tag when recovering an existing tag.
    env:
      VERSION: ${{ needs.release.outputs.version || needs.verify-tag.outputs.version }}
      CHANNEL: ${{ needs.release.outputs.channel || needs.verify-tag.outputs.channel }}
      REVISION: ${{ needs.release.outputs.revision || needs.verify-tag.outputs.revision }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # The environment allows only main, beta and alpha, so a publish-tag run must be dispatched from one of them.
    environment: release-dockerhub
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore signing of the attestations, Docker Hub OIDC login
      attestations: write
    strategy:
      # A failed platform must not cancel the other, so re-running only the failed job completes the matrix.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # The release commit, not the tag: the commit is what the revision label names, and the tag can still move.
      # Full history, so the next step can check that the commit is on the branch.
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.REVISION }}
          fetch-depth: 0
          persist-credentials: false

      # The channel tag comes from the version, so any other version shape (2.3.4-test.1) would publish its own
      # public tag. A publish-tag run is checked against the branch it was dispatched from.
      - name: Check the release
        run: |
          case "${GITHUB_REF_NAME}" in
            main) pattern='^[0-9]+\.[0-9]+\.[0-9]+$' expected=latest ;;
            beta | alpha) pattern="^[0-9]+\.[0-9]+\.[0-9]+-${GITHUB_REF_NAME}\.[0-9]+$" expected="${GITHUB_REF_NAME}" ;;
            *)
              echo "::error::Images are published only from main, beta or alpha (got: ${GITHUB_REF_NAME})."
              exit 1
              ;;
          esac
          if [[ ! "${VERSION}" =~ ${pattern} || "${CHANNEL}" != "${expected}" ]]; then
            echo "::error::${VERSION} (channel ${CHANNEL}) is not a ${GITHUB_REF_NAME} release."
            exit 1
          fi
          git merge-base --is-ancestor "${REVISION}" "origin/${GITHUB_REF_NAME}" && rc=0 || rc=$?
          if [[ "${rc}" -eq 1 ]]; then
            echo "::error::${REVISION} is not on ${GITHUB_REF_NAME}."
            exit 1
          elif [[ "${rc}" -ne 0 ]]; then
            echo "::error::git merge-base failed unexpectedly (exit ${rc})."
            exit "${rc}"
          fi
          sdk_version="$(jq -r .version packages/sdk/package.json)"
          if [[ "${sdk_version}" != "${VERSION}" ]]; then
            echo "::error::${REVISION} is @zama-fhe/sdk ${sdk_version}, not ${VERSION}."
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No password: the action exchanges the job's OIDC token for a short-lived Docker Hub token.
      - name: Log in to Docker Hardened Images
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_OIDC_USER }}

      # Built once, to a local OCI layout: the steps below test, scan and push this directory, so the pushed image is
      # the tested one. BuildKit's own provenance and SBOM are off; the signed attestations below replace them.
      # Reads, never writes, the gate's layer cache: a release can only restore caches from its own branch or the
      # default branch, which only merges write.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 # zizmor: ignore[cache-poisoning]
        with:
          context: .
          file: packages/sdk-daemon/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=${{ env.DAEMON_IMAGE_TITLE }}
            org.opencontainers.image.description=${{ env.DAEMON_IMAGE_DESCRIPTION }}
            org.opencontainers.image.licenses=${{ env.DAEMON_IMAGE_LICENSES }}
          outputs: type=oci,dest=${{ runner.temp }}/image,tar=false,name=${{ env.DAEMON_IMAGE }}:release-check
          provenance: false
          sbom: false
          cache-from: type=gha,scope=daemon-image-${{ matrix.arch }}

      # The layout's one image manifest is the digest that is scanned, pushed and attested.
      - name: Load the image
        id: image
        run: |
          digest="$(jq -r 'if (.manifests | length) == 1 and .manifests[0].mediaType == "application/vnd.oci.image.manifest.v1+json"
            then .manifests[0].digest else error("expected one image manifest") end' "${RUNNER_TEMP}/image/index.json")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          tar -C "${RUNNER_TEMP}/image" -c . | docker load

      - name: Check the image matches the release
        run: |
          ref="${DAEMON_IMAGE}:release-check"
          revision="$(docker image inspect "${ref}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          sdk_version="$(docker run --rm "${ref}" node -p 'require("/app/packages/sdk/package.json").version')"
          if [[ "${revision}" != "${REVISION}" || "${sdk_version}" != "${VERSION}" ]]; then
            echo "::error::The image is ${revision} with @zama-fhe/sdk ${sdk_version}, not ${REVISION} with ${VERSION}."
            exit 1
          fi

      - name: Start the daemon with the deployment Compose file
        env:
          ZAMA_SDK_VERSION: release-check
        run: |
          trap 'docker compose -f packages/sdk-daemon/deploy/compose.yaml down -v' EXIT
          docker compose -f packages/sdk-daemon/deploy/compose.yaml up -d --wait --wait-timeout 120

      # The branch tip, not the release commit: a CVE disclosed after the Daemon CI gate is risk-accepted on the
      # branch and picked up by re-running this job, and tags cut before the file existed can still be republished.
      - name: Checkout the branch's risk acceptances
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}
          path: branch-tip
          sparse-checkout: .trivyignore
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0

      # Same gate as Daemon CI: every CRITICAL or HIGH finding fails unless it was risk-accepted in .trivyignore.
      # The SBOM comes from the same Trivy and the same layout, so it lists what was scanned.
      - name: Scan the image and generate the SBOM
        run: |
          trivy image --input "${RUNNER_TEMP}/image" --pkg-types os,library --severity CRITICAL,HIGH \
            --ignorefile branch-tip/.trivyignore --exit-code 1
          trivy image --input "${RUNNER_TEMP}/image" --format spdx-json --output "${RUNNER_TEMP}/sbom.spdx.json"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed untagged, by digest: skopeo refuses to upload a manifest whose digest differs from the scanned one.
      # Nothing is reachable by tag until publish-image-manifest runs, which needs every platform to pass.
      - name: Push the scanned image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if ! command -v skopeo > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq skopeo
          fi
          skopeo copy --preserve-digests "oci:${RUNNER_TEMP}/image" "docker://${DAEMON_IMAGE}@${DIGEST}"
          pushed="$(docker buildx imagetools inspect "${DAEMON_IMAGE}@${DIGEST}" --format '{{ .Manifest.Digest }}')"
          if [[ "${pushed}" != "${DIGEST}" ]]; then
            echo "::error::GHCR serves ${pushed} for ${DIGEST}."
            exit 1
          fi

      # Signed with the workflow's OIDC identity and stored next to the image, so partners verify it with
      # `gh attestation verify oci://…` or cosign without trusting anything outside the registry and Sigstore.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.DAEMON_IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.DAEMON_IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      - name: Export digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: daemon-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # Matches the 30-day re-run window, so re-running one failed platform still finds the other's digest.
          retention-days: 30

  publish-image-manifest:
    needs: [release, verify-tag, publish-image]
    if: ${{ !cancelled() && needs.publish-image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # From the release run, or from verify-tag when recovering an existing tag.
    env:
      VERSION: ${{ needs.release.outputs.version || needs.verify-tag.outputs.version }}
      CHANNEL: ${{ needs.release.outputs.channel || needs.verify-tag.outputs.channel }}
      REVISION: ${{ needs.release.outputs.revision || needs.verify-tag.outputs.revision }}
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore signing of the attestation
      attestations: write
    steps:
      # One step per platform: a missing digest fails the job instead of publishing a single-platform image.
      - name: Download the amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daemon-digest-amd64
          path: ${{ runner.temp }}/digests

      - name: Download the arm64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daemon-digest-arm64
          path: ${{ runner.temp }}/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          sources=()
          for digest in *; do
            sources+=("${DAEMON_IMAGE}@sha256:${digest}")
          done
          # Move the channel tag only forward, so re-running an older run or recovering an older tag keeps it.
          # Versions on one channel share a prerelease suffix, so sort -V orders them.
          tags=(--tag "${DAEMON_IMAGE}:${VERSION}")
          if current="$(docker buildx imagetools inspect "${DAEMON_IMAGE}:${CHANNEL}" \
            --format '{{ index .Manifest.Annotations "org.opencontainers.image.version" }}' 2> inspect.err)"; then
            :
          elif grep -q "not found" inspect.err; then
            current=""
          else
            cat inspect.err
            exit 1
          fi
          if [[ "$(printf '%s\n%s\n' "${current}" "${VERSION}" | sort -V | tail -n 1)" == "${VERSION}" ]]; then
            tags+=(--tag "${DAEMON_IMAGE}:${CHANNEL}")
          else
            echo "::notice::${DAEMON_IMAGE}:${CHANNEL} stays on ${current}, newer than ${VERSION}."
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            --annotation "index:org.opencontainers.image.source=${SOURCE}" \
            --annotation "index:org.opencontainers.image.revision=${REVISION}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.title=${DAEMON_IMAGE_TITLE}" \
            --annotation "index:org.opencontainers.image.description=${DAEMON_IMAGE_DESCRIPTION}" \
            --annotation "index:org.opencontainers.image.licenses=${DAEMON_IMAGE_LICENSES}" \
            "${sources[@]}"
          docker buildx imagetools inspect "${DAEMON_IMAGE}:${VERSION}"
          digest="$(docker buildx imagetools inspect "${DAEMON_IMAGE}:${VERSION}" --format '{{ .Manifest.Digest }}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Tags resolve to the manifest list, so partners verifying `:<version>` or pinning its digest need an
      # attestation on this digest too; the per-platform image manifests were attested in publish-image.
      - name: Attest the manifest list
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.DAEMON_IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            echo "### Published the daemon image"
            echo ""
            echo "Pin: \`${DAEMON_IMAGE}:${VERSION}@${DIGEST}\`"
            echo ""
            echo "Verify:"
            echo ""
            echo '```sh'
            echo "gh attestation verify oci://${DAEMON_IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs even if npm publish failed: the tag exists and a re-run of the release job cannot republish it.
  publish-crate:
    needs: [release, verify-tag]
    if: >-
      ${{ !cancelled() && (needs.release.outputs.released == 'true'
      || (needs.verify-tag.result == 'success' && (inputs.publish == 'rust' || inputs.publish == 'all') && !inputs.dry-run)) }}
    # From the release run, or from verify-tag when recovering an existing tag.
    env:
      VERSION: ${{ needs.release.outputs.version || needs.verify-tag.outputs.version }}
      REVISION: ${{ needs.release.outputs.revision || needs.verify-tag.outputs.revision }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false

      - name: Install repository toolchain
        run: rustup show

      # Without --registry, cargo info inside the workspace reports the local package.
      - name: Check whether the version is already published
        id: published
        run: |
          if output="$(cargo info --registry crates-io "${CRATE}@${VERSION}" 2>&1)"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${CRATE}@${VERSION} is already on crates.io; skipping publish."
            echo "\`${CRATE}@${VERSION}\` was already on crates.io." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${output}" == *"could not find \`${CRATE}@${VERSION}\`"* ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not query crates.io for ${CRATE}@${VERSION}."
            echo "${output}"
            exit 1
          fi

      - name: Authenticate to crates.io
        id: auth
        if: steps.published.outputs.published == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: steps.published.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --locked --all-features -p "${CRATE}" --manifest-path clients/rust/Cargo.toml
          echo "Published \`${CRATE}@${VERSION}\` to crates.io." >> "$GITHUB_STEP_SUMMARY"

  # Runs even if npm publish failed: the tag exists and a re-run of the release job cannot republish it.
  publish-go:
    needs: [release, verify-tag]
    if: >-
      ${{ !cancelled() && (needs.release.outputs.released == 'true'
      || (needs.verify-tag.result == 'success' && (inputs.publish == 'go' || inputs.publish == 'all') && !inputs.dry-run)) }}
    # From the release run, or from verify-tag when recovering an existing tag.
    env:
      VERSION: ${{ needs.release.outputs.version || needs.verify-tag.outputs.version }}
      REVISION: ${{ needs.release.outputs.revision || needs.verify-tag.outputs.revision }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false

      # publish-tag recovery skips semantic-release and its module path check.
      - name: Resolve the module path
        id: module
        run: |
          path="$(node scripts/release/go-module.mjs "${VERSION}")"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      # Never move an existing tag: the checksum database pins the first content it served.
      # matching-refs is a prefix match, so select the exact ref.
      - name: Tag the Go module
        env:
          GH_TOKEN: ${{ secrets.SDK_RELEASER_TOKEN }}
        run: |
          tag="clients/go/v${VERSION}"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${tag}" \
            --jq ".[] | select(.ref == \"refs/tags/${tag}\") | \"\(.object.type) \(.object.sha)\"")"
          if [[ "${existing}" == "commit ${REVISION}" ]]; then
            echo "::notice::${tag} already exists on ${REVISION}; skipping."
            echo "\`${tag}\` already existed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          elif [[ -n "${existing}" ]]; then
            echo "::error::${tag} already exists (${existing}), not on ${REVISION}."
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" -f sha="${REVISION}" > /dev/null
          echo "Tagged \`${tag}\` at \`${REVISION}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Warm the Go module proxy
        working-directory: ${{ runner.temp }}
        env:
          MODULE: ${{ steps.module.outputs.path }}
          # No direct fallback, so a proxy failure fails the step.
          GOPROXY: https://proxy.golang.org
        run: |
          go list -m "${MODULE}@v${VERSION}"
          echo "Go proxy serves \`${MODULE}@v${VERSION}\`." >> "$GITHUB_STEP_SUMMARY"
