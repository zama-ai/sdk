name: Release Preview

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: release-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  # Safe-chain enforces its own minimum-package-age check independently of
  # pnpm-workspace.yaml — mirror both the age (72 h) and the exclusion here.
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@fhevm/sdk,@zama-fhe/sdk,@zama-fhe/react-sdk"
  DAEMON_IMAGE: ghcr.io/zama-ai/sdk-daemon
  CRATE: zama_sdk

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate target branch
        run: |
          if [[ "${GITHUB_REF_NAME}" != "main" && "${GITHUB_REF_NAME}" != "beta" && "${GITHUB_REF_NAME}" != "alpha" ]]; then
            echo "Release preview is only allowed from main, beta, or alpha (got: ${GITHUB_REF_NAME})."
            exit 1
          fi

  preview:
    needs: [validate-branch]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # semantic-release checks push access even in dry-run mode (git push --dry-run); nothing is pushed.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          ignore-scripts: "true"

      - name: Ensure npm >=11
        run: |
          npm_v="$(npm --version)"
          if [[ "${npm_v%%.*}" -lt 11 ]]; then
            echo "Bundled npm ${npm_v} is too old; installing npm 11"
            pnpm add -g npm@^11
            echo "$(pnpm bin -g)" >> "$GITHUB_PATH"
            export PATH="$(pnpm bin -g):$PATH"
          fi
          echo "npm $(npm --version)"
          [[ "$(npm --version | cut -d. -f1)" -ge 11 ]]

      - name: Build packages
        run: pnpm build

      # Outputs are written by the @semantic-release/exec commands in .releaserc.cjs.
      - name: Semantic release (dry-run)
        id: release
        run: pnpm release:dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write preview summary
        if: always()
        env:
          DRY_RUN_OUTCOME: ${{ steps.release.outcome }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          {
            echo "## Release Preview"
            echo ""
            if [[ "${DRY_RUN_OUTCOME}" != "success" ]]; then
              echo "The dry run failed; see the job log."
            elif [[ -n "${VERSION}" ]]; then
              echo "A release **would** be published: \`${VERSION}\` on the \`${CHANNEL}\` channel."
              echo ""
              echo "Daemon image tags: \`${DAEMON_IMAGE}:${VERSION}\`, \`${DAEMON_IMAGE}:${CHANNEL}\`"
              echo ""
              echo "Crate: \`${CRATE}@${VERSION}\`"
              echo ""
              echo "Go module tag: \`clients/go/v${VERSION}\`"
            else
              echo "No release would be published from this branch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
