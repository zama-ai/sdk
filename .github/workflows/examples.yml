name: Examples CI

# Lints, typechecks and builds each example, and runs its e2e suite where it has one,
# against this branch's SDK and, on main, the release it pins. examples/* are standalone
# npm projects with committed lockfiles, so users can copy them out as they are.
on:
  pull_request:
    branches: [main, beta, alpha]
    paths:
      - "examples/**"
      - "packages/sdk/**"
      - "packages/react-sdk/**"
      - "scripts/examples/**"
      - ".github/workflows/examples.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: examples-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  pack-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      examples: ${{ steps.examples.outputs.examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          ignore-scripts: "true"

      - name: List the examples
        id: examples
        run: |
          examples="$(node scripts/examples/examples.mjs --json)"
          echo "examples=${examples}" >> "$GITHUB_OUTPUT"

      - name: Build and pack the SDK
        run: node scripts/examples/local-sdk.mjs --pack "$RUNNER_TEMP/local-sdk"

      - name: Upload tarballs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: local-sdk
          path: ${{ runner.temp }}/local-sdk/*.tgz
          retention-days: 7
          if-no-files-found: error

  check:
    name: ${{ matrix.example.name }} (${{ matrix.sdk }} SDK)
    needs: [pack-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.pack-sdk.outputs.examples) }}
        # Off main, examples may use SDK API newer than their pins, so only main checks the pinned release.
        sdk: ${{ fromJSON((github.base_ref || github.ref_name) == 'main' && '["workspace","published"]' || '["workspace"]') }}
    defaults:
      run:
        working-directory: examples/${{ matrix.example.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: examples/${{ matrix.example.name }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download workspace SDK
        if: matrix.sdk == 'workspace'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: local-sdk
          path: ${{ runner.temp }}/local-sdk

      - name: Install workspace SDK
        if: matrix.sdk == 'workspace'
        working-directory: ${{ github.workspace }}
        env:
          EXAMPLE: ${{ matrix.example.name }}
        run: node scripts/examples/local-sdk.mjs --from "$RUNNER_TEMP/local-sdk" "$EXAMPLE"

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build --if-present

      # The e2e suites mock the RPC, so they need no chain or secrets, only the browser.
      - name: Install Playwright browser
        if: matrix.example.e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        if: matrix.example.e2e
        run: npm run test:e2e

      # On failure, Playwright drops diagnostics (error context, any traces)
      # under test-results/. No HTML reporter is configured, so there is no
      # playwright-report/ to upload.
      - name: Upload Playwright artifacts
        if: failure() && matrix.example.e2e
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-results-${{ matrix.example.name }}-${{ matrix.sdk }}
          path: examples/${{ matrix.example.name }}/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Sums up the matrix.
  examples:
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          CHECK: ${{ needs.check.result }}
        run: |
          echo "check: ${CHECK}"
          [[ "${CHECK}" == "success" ]]
