name: Docs

on:
  pull_request:
    branches: [main, beta, alpha]
    paths: &doc-paths
      - "docs/**"
      - "examples/**/README.md"
      - "examples/**/WALKTHROUGH.md"
      - "README.md"
      - "packages/*/README.md"
      - "packages/*/etc/**"
      - "scripts/llm/**"
      - "scripts/docs/**"
      - "llms.txt"
      - "llms-full.txt"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  # Promotions are branch-to-branch merges (beta→main; alpha→beta→main for breaking work)
  # with docs:retarget committed on top, so docs reach main/beta/alpha by direct push, not a PR.
  push:
    branches: [main, beta, alpha]
    paths: *doc-paths
  workflow_call:
  schedule:
    - cron: "0 6 * * *"

# Namespaced by workflow and event so the standalone Docs run, the scheduled run and the
# docs job reused by release.yml don't share a group on the same ref and cancel each other.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Check internal doc links
        run: pnpm exec turbo run docs:check-links

      - name: Verify LLM corpus artifacts are up to date
        run: pnpm exec turbo run llm:check

      # Doc URLs are branch-specific (raw.githubusercontent .../main|beta, docs.zama.org
      # .../stable|beta). `base_ref` is the PR's target branch; `ref_name` covers direct-push
      # and workflow_call (release). Fails if committed URLs target the wrong branch.
      - name: Verify doc URLs target the right branch
        run: pnpm docs:check-target "${{ github.base_ref || github.ref_name }}"

  # External link liveness for the published docs + READMEs. Internal links and
  # anchors are checked above by `pnpm docs:check-links`; this job covers `https://`
  # targets. A PR checks only the Markdown files it changes, so an outage on an
  # unrelated host can't block it. A daily run on main checks every file. It never
  # runs in a release, so link flakiness can't block one.
  link-check:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false
          # The PR merge commit and its base parent.
          fetch-depth: 2

      # File names come from the PR and the action runs `args` through `eval`, so the
      # filter allows only plain path characters.
      - name: Select files to check
        id: files
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -- ':(glob)docs/**/*.md' README.md ':(glob)packages/*/README.md'
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only --diff-filter=d HEAD^1 HEAD -- "$@")
          else
            changed=$(git ls-files -- "$@")
          fi
          files=$(printf '%s\n' "$changed" | { grep -E '^[A-Za-z0-9._/-]+$' || true; } | tr '\n' ' ')
          echo "list=$files" >> "$GITHUB_OUTPUT"

      - name: Check external links (lychee)
        if: steps.files.outputs.list != ''
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Accept 403/429 so bot-hostile hosts (Discord, Etherscan) don't flake the gate.
          # Placeholder URLs in code samples are listed in .lycheeignore.
          # github.com answers 503 to bursts of page requests, and lychee does not retry a 503,
          # so requests to one host are paced, and links to this repo's files are checked
          # against the checkout. The action runs `args` through `eval`, so the remap stays in
          # single quotes.
          args: >-
            --no-progress --max-retries 3 --accept 200..=299,403,429 --cache
            --host-concurrency 2 --host-request-interval 250ms
            --remap '^https://github\.com/zama-ai/sdk/(?:blob|tree)/[^/]+/([^#?]*).* file://${{ github.workspace }}/$1'
            ${{ steps.files.outputs.list }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          # A changed file may have no links at all.
          failIfEmpty: false
