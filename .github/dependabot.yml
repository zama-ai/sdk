version: 2
updates:
  # SDK core, workspace tooling, and test apps -- one pnpm workspace, "/" must stay in scope for the shared lockfile.
  - package-ecosystem: npm
    target-branch: beta
    directories:
      - /
      - /packages/sdk
      - /packages/react-sdk
      - /test/test-nextjs
      - /test/test-vite
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      exclude:
        - "@zama-fhe/relayer-sdk"
        - "@zama-fhe/sdk"
        - "@zama-fhe/react-sdk"
        - "@zama-fhe/test-components"
    groups:
      sdk:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
      # Protocol-version-tied; bumped via alpha, not routine Dependabot.
      - dependency-name: "@fhevm/sdk"

  # Example apps
  - package-ecosystem: npm
    target-branch: beta
    directories:
      - /examples/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      exclude:
        - "@zama-fhe/sdk"
        - "@zama-fhe/react-sdk"
    groups:
      example-apps:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch

  - package-ecosystem: github-actions
    target-branch: beta
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
