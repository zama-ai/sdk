name: Docs

on:
  pull_request:
    branches: [main, beta, alpha]
    paths: &doc-paths
      - "docs/**"
      - "examples/**/README.md"
      - "examples/**/WALKTHROUGH.md"
      - "README.md"
      - "packages/*/README.md"
      - "packages/*/etc/**"
      - "scripts/llm/**"
      - "scripts/docs/**"
      - "llms.txt"
      - "llms-full.txt"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  # Promotions are branch-to-branch merges (beta→main; alpha→beta→main for breaking work)
  # with docs:retarget committed on top, so docs reach main/beta/alpha by direct push, not a PR.
  push:
    branches: [main, beta, alpha]
    paths: *doc-paths
  workflow_call:

# Namespaced by workflow so the standalone Docs run (push/PR) and the docs job
# reused by release.yml don't share a group on the same ref and cancel each other.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Safe-chain enforces its own minimum-package-age check independently of
  # pnpm-workspace.yaml — mirror both the age (72 h) and the exclusion here.
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@fhevm/sdk,@zama-fhe/sdk,@zama-fhe/react-sdk"

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Install dependencies
        uses: ./.github/actions/install-deps

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Check internal doc links
        run: pnpm exec turbo run docs:check-links

      - name: Verify LLM corpus artifacts are up to date
        run: pnpm exec turbo run llm:check

      # Doc URLs are branch-specific (raw.githubusercontent .../main|beta, docs.zama.org
      # .../stable|beta). `base_ref` is the PR's target branch; `ref_name` covers direct-push
      # and workflow_call (release). Fails if committed URLs target the wrong branch.
      - name: Verify doc URLs target the right branch
        run: pnpm docs:check-target "${{ github.base_ref || github.ref_name }}"

  # External link liveness for the published docs + READMEs. Internal links and
  # anchors are checked above by `pnpm docs:check-links`; this job covers `https://`
  # targets. Runs for PRs and direct pushes to main/beta/alpha, but NOT when this
  # workflow is reused by release.yml: there `github.workflow` is the caller's name
  # ("Release"), so external flakiness still can't block a release. If it flakes on
  # PRs, move to a scheduled (cron) workflow.
  link-check:
    if: github.workflow == 'Docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: false

      - name: Check external links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Accept 403/429 so bot-hostile hosts (Discord, Etherscan) don't flake the gate.
          # Placeholder URLs in code samples are listed in .lycheeignore.
          args: --no-progress --max-retries 3 --accept 200..=299,403,429 --cache "docs/**/*.md" "README.md" "packages/*/README.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
