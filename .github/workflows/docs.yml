name: Docs

on:
  pull_request:
    branches: [main, prerelease]
    paths:
      - "docs/**"
      - "examples/**/README.md"
      - "examples/**/WALKTHROUGH.md"
      - "README.md"
      - "packages/*/README.md"
      - "packages/*/etc/**"
      - "scripts/llm/**"
      - "scripts/docs/**"
      - "llms.txt"
      - "llms-full.txt"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_call:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Safe-chain enforces its own minimum-package-age check independently of
  # pnpm-workspace.yaml#minimumReleaseAgeExclude — mirror the exemption here.
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@zama-fhe/relayer-sdk"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Aikido Safe Chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

      - name: Install dependencies
        run: pnpm ci

      - name: Check internal doc links
        run: pnpm docs:check-links

      - name: Verify LLM corpus artifacts are up to date
        run: pnpm llm:check

      # Doc URLs are branch-specific (raw.githubusercontent .../main|prerelease, and
      # docs.zama.org .../stable|alpha). `github.base_ref` is the branch this PR lands
      # on — reliable here even though the PR is checked out detached. If the committed
      # URLs target the wrong branch (e.g. a promotion that forgot `pnpm llm:retarget`),
      # this fails. `ref_name` covers the workflow_call (release) path.
      - name: Verify doc URLs target the right branch
        run: pnpm llm:check-target "${{ github.base_ref || github.ref_name }}"

  # External link liveness for the published docs + READMEs. Internal links and
  # anchors are checked above by `pnpm docs:check-links`; this job covers `https://`
  # targets. PR-only — skipped on the release `workflow_call` so external flakiness
  # can't block a release. If it flakes on PRs, move to a scheduled (cron) workflow.
  link-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false

      - name: Check external links (lychee)
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          # Accept 403/429 so bot-hostile hosts (Discord, Etherscan) don't flake the gate.
          # Placeholder URLs in code samples are listed in .lycheeignore.
          args: --no-progress --max-retries 3 --accept 200..=299,403,429 --cache "docs/**/*.md" "README.md" "packages/*/README.md"
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
