name: PR Title Lint
on:
  pull_request:
    branches: [main, prerelease]
    types: [opened, edited, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  pull-requests: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Workaround CVE-2026-31431 (copy.fail)
        run: echo "install algif_aead /bin/false" | sudo tee /etc/modprobe.d/disable-algif-aead.conf; if lsmod | grep -q algif_aead; then sudo rmmod algif_aead; fi
      - name: Validate Conventional Commit PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e '
            const title = process.env.PR_TITLE || "";
            const re = /^(feat|fix|perf|refactor|docs|chore|test|build|ci|revert|style)(\([^)]+\))?!?: .+/;
            if (!re.test(title)) {
              console.error("PR title must follow Conventional Commits (e.g. fix: ..., feat(scope): ...).");
              console.error(`Current title: "${title}"`);
              process.exit(1);
            }
          '
