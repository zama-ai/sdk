name: SBOM

# Builds and checks the release SBOMs of the package components on every change to their dependencies or to the
# SBOM tooling, so a release never finds out first. The daemon image SBOM is checked in Daemon CI.
on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "packages/sdk/package.json"
      - "packages/react-sdk/package.json"
      - "clients/go/go.mod"
      - "clients/go/go.sum"
      - "clients/rust/Cargo.toml"
      - "clients/rust/Cargo.lock"
      - "scripts/sbom/**"
      - ".github/actions/install-deps/**"
      - ".github/workflows/sbom.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_EXCLUSIONS: "@fhevm/sdk,@zama-fhe/sdk,@zama-fhe/react-sdk"

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-deps
        with:
          ignore-scripts: "true"

      # Keep in step with the release workflow.
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0

      - name: Generate and check the SBOMs
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version="0.0.0-pr.${SHA::12}"
          for component in sdk react-sdk client-go client-rust; do
            node scripts/sbom/generate.mjs "${component}" --version "${version}" --out "${RUNNER_TEMP}/sbom"
          done
          node scripts/sbom/generate.mjs index --version "${version}" --revision "${SHA}" --out "${RUNNER_TEMP}/sbom"

      - name: Upload the SBOMs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom-pr
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          retention-days: 7
